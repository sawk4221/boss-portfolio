
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LightBoss | Lighting Director 서보윤</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;600;700&family=Noto+Sans+KR:wght@100;300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
            overflow-x: hidden;
        }
        body.modal-open {
            overflow: hidden;
        }
        .cinematic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2px;
        }
        .aspect-square {
            aspect-ratio: 1 / 1;
        }
        .font-thin-spaced {
            font-weight: 100;
            letter-spacing: 0.4em;
            text-transform: uppercase;
        }
        /* Fade in animations */
        @keyframes fadeIn {
          from { opacity: 0; }
          to { opacity: 1; }
        }
        .animate-fade-in {
          animation: fadeIn 1s ease forwards;
        }
        
        /* YouTube background container */
        .video-background {
          position: absolute;
          top: 50%;
          left: 50%;
          width: 100vw;
          height: 100vh;
          transform: translate(-50%, -50%);
          pointer-events: none;
        }
        @media (min-aspect-ratio: 16/9) {
          .video-background { height: 56.25vw; }
        }
        @media (max-aspect-ratio: 16/9) {
          .video-background { width: 177.78vh; }
        }
    </style>
<script type="importmap">

</body>
</html>
